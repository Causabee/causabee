<!doctype html>
<!-- The picture behind the disk image's window (scripts/dmg/background.tiff), 660 × 400: Causabee on
     the left at (170, 170), the Applications folder on the right at (490, 170), as make-dmg.sh places
     them. Made again with scripts/dmg/make-background.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Causabee disk image background</title>
<style>
  @font-face {
    font-family: "Source Serif 4";
    src: url("../../site/assets/fonts/SourceSerif4.woff2") format("woff2");
    font-weight: 200 900;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 660px; height: 400px; overflow: hidden; }
  body {
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: #1d1d1f;
    background:
      radial-gradient(420px 300px at 0% 0%, rgba(255, 219, 13, 0.20), rgba(255, 219, 13, 0) 70%),
      linear-gradient(180deg, #ffffff 0%, #f5f5f4 100%);
    -webkit-font-smoothing: antialiased;
  }
  .arrow { position: absolute; left: 0; top: 0; }
  .caption { position: absolute; left: 0; right: 0; top: 296px; text-align: center; }
  .caption h1 { font: 600 24px / 1.2 "Source Serif 4", Georgia, serif; letter-spacing: -0.01em; }
  .caption p { margin-top: 6px; font-size: 13px; color: #6e6e73; }
</style>
</head>
<body>
  <!-- From beside Causabee's icon to beside the folder's, bowing a little upward; the head is a
       marker, so it always lies along the line's end. -->
  <svg class="arrow" width="660" height="400" viewBox="0 0 660 400" fill="none" aria-hidden="true">
    <defs>
      <marker id="head" viewBox="0 0 12 12" refX="9.4" refY="6" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
        <path d="M3.6 2.4 L10 6 L3.6 9.6" stroke="#7F5E00" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <path d="M264 174 C 300 160, 354 158, 392 168" stroke="#7F5E00" stroke-width="2.5" stroke-linecap="round" marker-end="url(#head)"/>
  </svg>
  <div class="caption">
    <h1>Drag Causabee to Applications</h1>
    <p>Then open it from your Applications folder.</p>
  </div>
</body>
</html>
