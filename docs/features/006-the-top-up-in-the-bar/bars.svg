<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 380" font-family="-apple-system, SF Pro Text, Helvetica, sans-serif">
  <rect width="1080" height="380" fill="#F5F5F4"/>
  <!-- 1 · Pro and a top-up, the month in use -->
  <g transform="translate(24,24)">
    <rect width="330" height="300" rx="14" fill="#FFFFFF"/>
    <text x="20" y="34" font-size="15" font-weight="600" fill="#22211B">Pro</text>
    <text x="310" y="34" font-size="12" fill="#87867E" text-anchor="end">renews 1 Dec</text>
    <text x="20" y="84" font-size="30" font-weight="600" fill="#22211B">40 %</text>
    <text x="100" y="84" font-size="14" fill="#87867E">left</text>
    <rect x="20" y="98" width="290" height="6" rx="3" fill="#E3E3E0"/>
    <rect x="20" y="98" width="116" height="6" rx="3" fill="#FFDB0D"/>
    <text x="20" y="150" font-size="30" font-weight="600" fill="#22211B">67 %</text>
    <text x="100" y="150" font-size="14" fill="#87867E">of a Pro month in top-ups</text>
    <rect x="20" y="164" width="290" height="6" rx="3" fill="#E3E3E0"/>
    <rect x="20" y="164" width="193" height="6" rx="3" fill="#B38F00"/>
    <text x="20" y="196" font-size="12" fill="#87867E">Starts anew on 1 December · top-ups carry over</text>
    <text x="20" y="282" font-size="12" fill="#A3A29B">1 · the month first; the top-ups wait</text>
  </g>
  <!-- 2 · The month used, the top-ups in use, running low -->
  <g transform="translate(375,24)">
    <rect width="330" height="300" rx="14" fill="#FFFFFF"/>
    <text x="20" y="34" font-size="15" font-weight="600" fill="#22211B">Pro</text>
    <text x="310" y="34" font-size="12" fill="#87867E" text-anchor="end">renews 1 Dec</text>
    <text x="20" y="84" font-size="30" font-weight="600" fill="#22211B">0 %</text>
    <text x="84" y="84" font-size="14" fill="#87867E">left</text>
    <rect x="20" y="98" width="290" height="6" rx="3" fill="#E3E3E0"/>
    <rect x="20" y="98" width="6" height="6" rx="3" fill="#FFDB0D"/>
    <text x="20" y="150" font-size="30" font-weight="600" fill="#C76600">15 %</text>
    <text x="100" y="150" font-size="14" fill="#87867E">of a Pro month in top-ups</text>
    <rect x="20" y="164" width="290" height="6" rx="3" fill="#E3E3E0"/>
    <rect x="20" y="164" width="44" height="6" rx="3" fill="#C76600"/>
    <text x="20" y="196" font-size="12" fill="#87867E">Starts anew on 1 December · top-ups carry over</text>
    <text x="20" y="282" font-size="12" fill="#A3A29B">2 · the month used: the top-ups go down;</text>
    <text x="20" y="298" font-size="12" fill="#A3A29B">low, the bar in use turns orange</text>
  </g>
  <!-- 3 · Top-ups alone, more than a Pro month -->
  <g transform="translate(726,24)">
    <rect width="330" height="300" rx="14" fill="#FFFFFF"/>
    <text x="20" y="34" font-size="15" font-weight="600" fill="#22211B">Pro, now and then</text>
    <text x="20" y="84" font-size="30" font-weight="600" fill="#22211B">133 %</text>
    <text x="118" y="84" font-size="14" fill="#87867E">of a Pro month in top-ups</text>
    <rect x="20" y="98" width="290" height="6" rx="3" fill="#E3E3E0"/>
    <rect x="20" y="98" width="290" height="6" rx="3" fill="#B38F00"/>
    <text x="20" y="130" font-size="12" fill="#87867E">Top-ups carry over from month to month.</text>
    <text x="20" y="282" font-size="12" fill="#A3A29B">3 · without Pro: only the top-ups' bar;</text>
    <text x="20" y="298" font-size="12" fill="#A3A29B">four top-ups fill it, and the number says more</text>
  </g>
  <text x="24" y="360" font-size="12" fill="#87867E">F006 · sketch, light mode. Yellow #FFDB0D the month (Theme.bee), dark gold #B38F00 the top-ups (Theme.topUp, new), orange #C76600 low (Theme.warning).</text>
</svg>
