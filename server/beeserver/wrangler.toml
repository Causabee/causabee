# The beeserver on Cloudflare Workers, at beeserver.causabee.app.
name = "beeserver"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# Request bodies are never logged: only the Worker's own short errors.
[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "beeserver"
database_id = "6274e1e2-edc2-49d0-b4cb-3ddd327d5677"

# Secrets, never in this file — set once with `npx wrangler secret put <NAME>`:
#   OPENAI_API_KEY, ANTHROPIC_API_KEY  — Causabee's own keys, made for the server alone
#   ADMIN_SECRET                       — for /admin/*, kept by Ralf
